name: Compilar Teleponter

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generar carpeta android/
        run: |
          flutter create --org com.teleponter --project-name teleponter --platforms=android .
          rm -f test/widget_test.dart
          python3 tool/patch_platforms.py

      - run: flutter pub get
      - name: Pruebas
        run: flutter test
      - name: Compilar APK
        run: flutter build apk --release

      - name: Renombrar
        run: cp build/app/outputs/flutter-apk/app-release.apk Teleponter-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Teleponter-android
          path: Teleponter-android.apk

      - name: Publicar en Release (sólo con etiqueta v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Teleponter-android.apk

  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generar carpeta windows/
        shell: pwsh
        run: |
          flutter create --org com.teleponter --project-name teleponter --platforms=windows .
          if (Test-Path test/widget_test.dart) { Remove-Item test/widget_test.dart }
          python tool/patch_platforms.py

      - run: flutter pub get
      - name: Compilar para Windows
        run: flutter build windows --release

      - name: Empaquetar ZIP
        shell: pwsh
        run: |
          Copy-Item README.md build/windows/x64/runner/Release/LEEME.md
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Teleponter-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Teleponter-windows
          path: Teleponter-windows.zip

      - name: Publicar en Release (sólo con etiqueta v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Teleponter-windows.zip
